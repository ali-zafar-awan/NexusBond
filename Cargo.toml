[workspace]
members = [
    "crates/nexus-proto",
    "crates/nexus-crypto",
    "crates/nexus-linkmon",
    "crates/nexus-sched",
    "crates/nexus-tun",
    "crates/nexus-relay",
    "crates/nexus-client",
    "crates/nexus-localdispatch",
    "crates/nexus-fetch",
    "crates/nexus-ipc",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["NexusBond Contributors"]
license = "MIT"
repository = "https://github.com/nexusbond/nexusbond"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
thiserror = "1.0"
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
chacha20poly1305 = "0.10"
snow = "0.9"
blake2 = "0.10"
toml = "0.8"
futures = "0.3"
